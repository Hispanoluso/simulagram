<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Evaluaciones - La Escuela - Dojo de Español</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: radial-gradient(circle at top right, #1e3a8a, #0f172a 60%); color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-box { background: #1e293b; border: 1px solid #334155; border-radius: 16px; width: 100%; max-width: 400px; padding: 36px 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.45); text-align: center; }
        .logo { width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 14px auto; display: block; object-fit: cover; border: 2px solid rgba(96,165,250,0.4); }
        .badge { display: inline-block; background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); font-size: 0.75rem; font-weight: 700; padding: 4px 12px; border-radius: 999px; margin-bottom: 12px; letter-spacing: 1px; text-transform: uppercase; }
        h1 { font-size: 1.5rem; margin-bottom: 6px; color: #fff; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 24px; }
        input[type="password"] { width: 100%; padding: 13px 14px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: #fff; font-size: 1rem; margin-bottom: 18px; text-align: center; }
        input[type="password"]:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.25); }
        button { width: 100%; padding: 13px; background: #3b82f6; color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
        button:hover { background: #2563eb; }
        .error { display: none; background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4); color: #fca5a5; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; }
    </style>
</head>

        <h1>Portal de Evaluaciones</h1>
        <p>Digite a senha de acesso para entrar na plataforma</p>

            <button type="submit" id="btn">Entrar na Plataforma</button>
        </form>
    </div>

        function base64ToBuf(b64) {
            const bin = window.atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return bytes.buffer;
        }

        async function unlock(password) {
            const err = document.getElementById('err');
            const btn = document.getElementById('btn');
            err.style.display = 'none';
            btn.textContent = 'Verificando...';

            try {
                const enc = new TextEncoder();
                const keyMaterial = await crypto.subtle.importKey(
                    "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
                );
                const key = await crypto.subtle.deriveKey(
                    { name: "PBKDF2", salt: base64ToBuf(ENCRYPTED_DATA.salt), iterations: 100000, hash: "SHA-256" },
                    keyMaterial,
                    { name: "AES-GCM", length: 256 },
                    false,
                    ["decrypt"]
                );
                const decryptedBuf = await crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: base64ToBuf(ENCRYPTED_DATA.iv) },
                    key,
                    base64ToBuf(ENCRYPTED_DATA.cipher)
                );

                const decodedHtml = new TextDecoder().decode(decryptedBuf);
                document.open();
                document.write(decodedHtml);
                document.close();
            } catch (e) {
                err.style.display = 'block';
                btn.textContent = 'Entrar na Plataforma';
                document.getElementById('pass').value = '';
                document.getElementById('pass').focus();
            }
        }

        document.getElementById('unlockForm').addEventListener('submit', (e) => {
            e.preventDefault();
            unlock(document.getElementById('pass').value.trim());
        });
    </script>
